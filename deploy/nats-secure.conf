# NATS com contas e menor privilegio por servico.
# Uso: docker compose -f docker-compose.yml -f docker-compose.secure.yml up
# Defina as senhas via variaveis de ambiente do compose.

jetstream {}
http: 8222

accounts {
  QSIM {
    jetstream: enabled
    users [
      {
        user: gateway
        password: $QSIM_PASS_GATEWAY
        permissions {
          publish   = ["qsim.jobs.submit", "qsim.control.>", "_INBOX.>"]
          subscribe = ["qsim.jobs.result.>", "qsim.telemetry.>", "_INBOX.>"]
        }
      }
      {
        user: scheduler
        password: $QSIM_PASS_SCHEDULER
        permissions {
          publish   = ["qsim.jobs.exec.>", "qsim.jobs.result.>", "_INBOX.>"]
          subscribe = ["qsim.jobs.submit", "qsim.jobs.result.>",
                       "qsim.control.>", "_INBOX.>"]
        }
      }
      {
        user: engine
        password: $QSIM_PASS_ENGINE
        permissions {
          publish   = ["qsim.jobs.result.>", "qsim.telemetry.>", "_INBOX.>"]
          subscribe = ["qsim.jobs.exec.>", "qsim.jobs.exec",
                       "qsim.control.>", "_INBOX.>"]
        }
      }
      {
        user: sdk
        password: $QSIM_PASS_SDK
        permissions {
          publish   = ["qsim.jobs.submit", "qsim.control.cancel.>", "_INBOX.>"]
          subscribe = ["qsim.jobs.result.>", "_INBOX.>"]
        }
      }
    ]
  }
}
